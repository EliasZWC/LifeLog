<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#EFEFED" />
    <title>LifeLog</title>
    <link rel="stylesheet" href="styles.css" />

    <!-- 在解析样式前先套用已保存的主题，避免首屏闪一下系统主题 -->
    <script>
        (function () {
            try {
                var mode = localStorage.getItem('lifelog.theme');
                if (mode === 'light' || mode === 'dark') {
                    document.documentElement.setAttribute('data-theme', mode);
                }
            } catch (e) { /* 忽略 */ }
        })();
    </script>
</head>

<body>
    <div id="app">
        <header class="page-header">
            <h1 class="page-title" id="page-title" data-i18n="nav.time">Time</h1>
        </header>

        <main id="content">
            <!-- 时间页：记录行动发生的时间。分「全部 / 时段 / 时点」三个视图 -->
            <section class="page" id="page-time" role="tabpanel" aria-labelledby="tab-time">
                <div class="view-bar">
                    <span class="view-current" id="view-current">All</span>
                    <button class="icon-button" type="button" id="view-button" aria-haspopup="menu"
                        aria-expanded="false" aria-label="Switch view" data-i18n-aria-label="view.switch">
                        <!-- Google Material Icons: view_list -->
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path
                                d="M3,14h4v-4H3V14z M3,19h4v-4H3V19z M3,9h4V5H3V9z M8,14h13v-4H8V14z M8,19h13v-4H8V19z M8,5v4h13V5H8z" />
                        </svg>
                    </button>
                </div>

                <ul class="card-list" id="time-list"></ul>
            </section>

            <!-- 行为页：建立可被记录的行为 -->
            <section class="page" id="page-behavior" role="tabpanel" aria-labelledby="tab-behavior" hidden>
                <ul class="card-list" id="behavior-list"></ul>
            </section>

            <!-- 设置页：按分区列出应用设置 -->
            <section class="page" id="page-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
                <section class="settings-group">
                    <h2 class="settings-group-title"
                        data-i18n="settings.group.personalization">Personalization</h2>
                    <ul class="settings-list">
                        <li class="settings-item">
                            <span class="settings-label" data-i18n="settings.theme">Theme</span>
                            <div class="select-wrap" id="setting-theme"></div>
                        </li>
                    </ul>
                </section>

                <section class="settings-group">
                    <h2 class="settings-group-title" data-i18n="settings.group.data">Data</h2>
                    <ul class="settings-list">
                        <li class="settings-item">
                            <button class="settings-action" type="button" id="setting-import">
                                <span class="settings-label" data-i18n="settings.import">Import CSV</span>
                                <span class="icon" aria-hidden="true">
                                    <!-- Google Material Icons: file_upload -->
                                    <svg viewBox="0 0 24 24" focusable="false">
                                        <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z" />
                                    </svg>
                                </span>
                            </button>
                        </li>
                        <li class="settings-item settings-item-column">
                            <span class="settings-label" data-i18n="settings.import.hint">Database file</span>
                            <span class="settings-caption" id="setting-storage-path">—</span>
                        </li>
                    </ul>
                    <!-- 由原生 WebChromeClient 接管，弹出系统文件选择器 -->
                    <input class="file-input" type="file" id="setting-import-file"
                        accept=".csv,text/csv,text/comma-separated-values" />
                </section>

                <section class="settings-group">
                    <h2 class="settings-group-title" data-i18n="settings.group.about">About</h2>
                    <ul class="settings-list">
                        <li class="settings-item">
                            <span class="settings-label" data-i18n="settings.version">Version</span>
                            <span class="settings-value" id="setting-version">—</span>
                        </li>
                    </ul>
                </section>
            </section>

            <!-- 悬浮按钮放在 #content 下（不在可滚动页面里），这样页面的进入动画不会影响它们的定位 -->
            <button class="fab" type="button" id="time-fab" data-tab="time" aria-label="Add record"
                data-i18n-aria-label="time.add">
                <!-- Google Material Icons: add -->
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                </svg>
            </button>

            <button class="fab" type="button" id="behavior-fab" data-tab="behavior" aria-label="Add behavior"
                data-i18n-aria-label="behavior.add" hidden>
                <!-- Google Material Icons: add -->
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                </svg>
            </button>
        </main>

        <nav class="bottom-nav" role="tablist" aria-label="Main navigation"
            data-i18n-aria-label="nav.label">

            <button class="nav-item" type="button" role="tab" id="tab-time" aria-controls="page-time"
                aria-selected="true" data-page="time">
                <span class="nav-icon" aria-hidden="true">
                    <!-- Google Material Icons: schedule -->
                    <svg viewBox="0 0 24 24" focusable="false">
                        <path
                            d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z" />
                        <path d="M12.5 7H11v6l5.25 3.15.75-1.23-4.5-2.67z" />
                    </svg>
                </span>
                <span class="nav-label" data-i18n="nav.time">Time</span>
            </button>

            <button class="nav-item" type="button" role="tab" id="tab-behavior" aria-controls="page-behavior"
                aria-selected="false" data-page="behavior">
                <span class="nav-icon" aria-hidden="true">
                    <!-- Google Material Icons: touch_app -->
                    <svg viewBox="0 0 24 24" focusable="false">
                        <path
                            d="M9,11.24V7.5C9,6.12,10.12,5,11.5,5S14,6.12,14,7.5v3.74c1.21-0.81,2-2.18,2-3.74C16,5.01,13.99,3,11.5,3S7,5.01,7,7.5 C7,9.06,7.79,10.43,9,11.24z M18.84,15.87l-4.54-2.26c-0.17-0.07-0.35-0.11-0.54-0.11H13v-6C13,6.67,12.33,6,11.5,6 S10,6.67,10,7.5v10.74c-3.6-0.76-3.54-0.75-3.67-0.75c-0.31,0-0.59,0.13-0.79,0.33l-0.79,0.8l4.94,4.94 C9.96,23.83,10.34,24,10.75,24h6.79c0.75,0,1.33-0.55,1.44-1.28l0.75-5.27c0.01-0.07,0.02-0.14,0.02-0.2 C19.75,16.63,19.37,16.09,18.84,15.87z" />
                    </svg>
                </span>
                <span class="nav-label" data-i18n="nav.behavior">Behavior</span>
            </button>

            <button class="nav-item" type="button" role="tab" id="tab-settings" aria-controls="page-settings"
                aria-selected="false" data-page="settings">
                <span class="nav-icon" aria-hidden="true">
                    <!-- Google Material Icons: settings -->
                    <svg viewBox="0 0 24 24" focusable="false">
                        <path
                            d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z" />
                    </svg>
                </span>
                <span class="nav-label" data-i18n="nav.settings">Settings</span>
            </button>
        </nav>
    </div>

    <!-- 卡片多选的顶部操作栏 -->
    <div class="selection-bar" id="selection-bar" hidden>
        <button class="icon-button" type="button" id="selection-close" aria-label="Cancel selection"
            data-i18n-aria-label="selection.cancel">
            <!-- Google Material Icons: close -->
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                    d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
            </svg>
        </button>

        <span class="selection-count" id="selection-count"></span>

        <button class="icon-button" type="button" id="selection-delete" aria-label="Delete selected"
            data-i18n-aria-label="selection.delete">
            <!-- Google Material Icons: delete -->
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
            </svg>
        </button>
    </div>

    <!-- 行为详情页：全屏覆盖在 app 之上（自带标题栏，所以盖住底部导航） -->
    <section class="detail" id="behavior-detail" role="dialog" aria-modal="true"
        aria-labelledby="detail-title" hidden>
        <header class="detail-header">
            <button class="icon-button" type="button" id="detail-back" aria-label="Back"
                data-i18n-aria-label="behavior.detail.back">
                <!-- Google Material Icons: arrow_back -->
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                </svg>
            </button>

            <h1 class="page-title" id="detail-title"></h1>

            <button class="icon-button" type="button" id="detail-menu" aria-haspopup="menu"
                aria-expanded="false" aria-label="More options" data-i18n-aria-label="behavior.menu.open">
                <!-- Google Material Icons: more_vert -->
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                        d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" />
                </svg>
            </button>
        </header>

        <div class="view-bar">
            <span class="view-current" id="detail-view-current"></span>
            <button class="icon-button" type="button" id="detail-view-button" aria-haspopup="menu"
                aria-expanded="false" aria-label="Switch view" data-i18n-aria-label="view.switch">
                <!-- Google Material Icons: view_list -->
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                        d="M3,14h4v-4H3V14z M3,19h4v-4H3V19z M3,9h4V5H3V9z M8,14h13v-4H8V14z M8,19h13v-4H8V19z M8,5v4h13V5H8z" />
                </svg>
            </button>
        </div>

        <div class="detail-body">
            <ul class="card-list" id="detail-list"></ul>
        </div>
    </section>

    <!-- 删除行为确认：必须输入行为名称（类似 GitHub 删仓库） -->
    <section class="sheet" id="sheet-delete-behavior" role="dialog" aria-modal="true"
        aria-labelledby="sheet-delete-title" hidden>
        <h2 class="sheet-title" id="sheet-delete-title" data-i18n="behavior.delete.title">
            Delete behavior</h2>
        <p class="sheet-text" id="delete-tip"></p>

        <div class="form-row">
            <input class="form-input form-input-left" id="delete-confirm-input" type="text"
                autocomplete="off" data-i18n-placeholder="behavior.delete.hint"
                placeholder="Behavior name" />
        </div>

        <div class="form-actions">
            <button class="btn" type="button" id="delete-cancel"
                data-i18n="action.cancel">Cancel</button>
            <button class="btn btn-danger" type="button" id="delete-confirm" disabled
                data-i18n="behavior.delete.confirm">Delete</button>
        </div>
    </section>

    <!-- 弹窗遮罩 -->
    <div class="scrim" id="scrim" hidden></div>

    <!-- 行为表单：名称 / 图标 / 取消·确定 -->
    <section class="sheet" id="sheet-behavior" role="dialog" aria-modal="true"
        aria-labelledby="sheet-behavior-title" hidden>
        <h2 class="sheet-title" id="sheet-behavior-title" data-i18n="behavior.form.title">New behavior</h2>

        <div class="form-row">
            <label class="form-label" for="behavior-name" data-i18n="behavior.form.name">Name</label>
            <input class="form-input" id="behavior-name" type="text" maxlength="24" autocomplete="off"
                data-i18n-placeholder="behavior.form.namePlaceholder" placeholder="e.g. Sleep" />
        </div>

        <div class="form-block">
            <span class="form-label" data-i18n="behavior.form.icon">Icon</span>
            <!-- 图标由 icons.js 提供，这里由脚本填充 -->
            <div class="icon-picker" id="behavior-icon-picker"></div>
        </div>

        <div class="form-actions">
            <button class="btn" type="button" id="behavior-cancel"
                data-i18n="action.cancel">Cancel</button>
            <button class="btn btn-primary" type="button" id="behavior-confirm" disabled
                data-i18n="action.confirm">Confirm</button>
        </div>
    </section>

    <!-- 时间表单：行为 / 类型 / 时间 / 取消·确定 -->
    <section class="sheet" id="sheet-time" role="dialog" aria-modal="true"
        aria-labelledby="sheet-time-title" hidden>
        <h2 class="sheet-title" id="sheet-time-title" data-i18n="time.form.title">New record</h2>

        <div class="form-row">
            <label class="form-label" data-i18n="time.form.behavior">Behavior</label>
            <div class="select-wrap" id="time-behavior"></div>
        </div>

        <div class="form-row">
            <label class="form-label" data-i18n="time.form.type">Type</label>
            <div class="select-wrap" id="time-type"></div>
        </div>

        <div class="form-block">
            <!-- 必须先选类型，这里才可填写 -->
            <div class="time-fields" id="time-fields"></div>
            <p class="form-hint" id="time-hint" hidden></p>
        </div>

        <div class="form-actions">
            <button class="btn" type="button" id="time-cancel" data-i18n="action.cancel">Cancel</button>
            <button class="btn btn-primary" type="button" id="time-confirm" disabled
                data-i18n="action.confirm">Confirm</button>
        </div>
    </section>

    <script src="i18n.js"></script>
    <script src="icons.js"></script>
    <script src="csv.js"></script>
    <script src="store.js"></script>
    <script src="components.js"></script>
    <script src="theme.js"></script>
    <script src="page-behavior.js"></script>
    <script src="page-behavior-detail.js"></script>
    <script src="page-time.js"></script>
    <script src="settings.js"></script>
    <script src="app.js"></script>
</body>

</html>
