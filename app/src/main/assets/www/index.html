<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#EFEFED" />
    <title>Livolog</title>
    <link rel="stylesheet" href="styles.css" />

    <!-- 在解析样式前先套用已保存的主题，避免首屏闪一下系统主题 -->
    <script>
        (function () {
            try {
                var mode = localStorage.getItem('lifelog.theme');
                if (mode === 'light' || mode === 'dark') {
                    document.documentElement.setAttribute('data-theme', mode);
                }
            } catch (e) { /* 忽略 */ }
        })();
    </script>
</head>

<body>
    <div id="app">
        <header class="page-header">
            <h1 class="page-title" id="page-title" data-i18n="nav.time">Time</h1>
        </header>

        <main id="content">
            <!-- 时间页：记录行动发生的时间。分「全部 / 时段 / 时点」三个视图 -->
            <section class="page" id="page-time" role="tabpanel" aria-labelledby="tab-time">
                <div class="view-bar">
                    <span class="view-current" id="view-current">All</span>
                    <button class="icon-button" type="button" id="view-button" aria-haspopup="menu"
                        aria-expanded="false" aria-label="Switch view" data-i18n-aria-label="view.switch">
                        <!-- Google Material Icons: view_list -->
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path
                                d="M3,14h4v-4H3V14z M3,19h4v-4H3V19z M3,9h4V5H3V9z M8,14h13v-4H8V14z M8,19h13v-4H8V19z M8,5v4h13V5H8z" />
                        </svg>
                    </button>
                </div>

                <ul class="card-list" id="time-list"></ul>
            </section>

            <!-- 行为页：建立可被记录的行为 -->
            <section class="page" id="page-behavior" role="tabpanel" aria-labelledby="tab-behavior" hidden>
                <ul class="card-list" id="behavior-list"></ul>
            </section>

            <!-- 跟踪页：建立被跟踪的数据项（体重 / 腰围 / 喝水量 …），不参与时间记录 -->
            <section class="page" id="page-metric" role="tabpanel" aria-labelledby="tab-metric" hidden>
                <ul class="card-list" id="metric-list"></ul>
            </section>

            <!-- 设置页：按分区列出应用设置 -->
            <section class="page" id="page-setting" role="tabpanel" aria-labelledby="tab-setting" hidden>
                <section class="setting-group">
                    <h2 class="setting-group-title" data-i18n="setting.group.general">General</h2>
                    <ul class="setting-list">
                        <li class="setting-item">
                            <button class="setting-action" type="button" id="setting-language"
                                aria-haspopup="menu" aria-expanded="false">
                                <span class="setting-label" data-i18n="setting.language">Language</span>
                                <span class="setting-value" id="setting-language-value">—</span>
                            </button>
                        </li>
                        <li class="setting-item">
                            <button class="setting-action" type="button" id="setting-theme"
                                aria-haspopup="menu" aria-expanded="false">
                                <span class="setting-label" data-i18n="setting.theme">Theme</span>
                                <span class="setting-value" id="setting-theme-value">—</span>
                            </button>
                        </li>
                    </ul>
                </section>

                <section class="setting-group">
                    <h2 class="setting-group-title" data-i18n="setting.group.data">Data</h2>
                    <ul class="setting-list">
                        <li class="setting-item">
                            <button class="setting-action" type="button" id="setting-storage">
                                <span class="setting-label" data-i18n="setting.storage">Storage location</span>
                                <span class="setting-value" id="setting-storage-path">—</span>
                            </button>
                        </li>
                        <li class="setting-item">
                            <button class="setting-action" type="button" id="setting-import">
                                <span class="setting-label" data-i18n="setting.import">Import data</span>
                                <span class="icon" aria-hidden="true">
                                    <!-- Google Material Icons: file_upload -->
                                    <svg viewBox="0 0 24 24" focusable="false">
                                        <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z" />
                                    </svg>
                                </span>
                            </button>
                        </li>
                        <li class="setting-item">
                            <button class="setting-action" type="button" id="setting-export">
                                <span class="setting-label" data-i18n="setting.export">Export data</span>
                                <span class="icon" aria-hidden="true">
                                    <!-- Google Material Icons: file_download -->
                                    <svg viewBox="0 0 24 24" focusable="false">
                                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
                                    </svg>
                                </span>
                            </button>
                        </li>
                    </ul>
                    <!-- 由原生 WebChromeClient 接管，弹出系统文件选择器 -->
                    <input class="file-input" type="file" id="setting-import-file"
                        accept=".csv,text/csv,text/comma-separated-values" />
                </section>

                <section class="setting-group">
                    <h2 class="setting-group-title" data-i18n="setting.group.about">About</h2>
                    <ul class="setting-list">
                        <li class="setting-item">
                            <span class="setting-label" data-i18n="setting.version">Version</span>
                            <span class="setting-value" id="setting-version">—</span>
                        </li>
                        <li class="setting-item">
                            <button class="setting-action" type="button" id="setting-contact">
                                <span class="setting-label" data-i18n="setting.contact">Contact</span>
                                <span class="setting-value" id="setting-contact-value"></span>
                            </button>
                        </li>
                    </ul>
                </section>
            </section>

            <!-- 悬浮按钮放在 #content 下（不在可滚动页面里），这样页面的进入动画不会影响它们的定位 -->
            <button class="fab" type="button" id="time-fab" data-tab="time" aria-label="Add record"
                data-i18n-aria-label="time.add">
                <!-- Google Material Icons: add -->
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                </svg>
            </button>

            <button class="fab" type="button" id="behavior-fab" data-tab="behavior" aria-label="Add behavior"
                data-i18n-aria-label="behavior.add" hidden>
                <!-- Google Material Icons: add -->
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                </svg>
            </button>

            <button class="fab" type="button" id="metric-fab" data-tab="metric" aria-label="Add tracker"
                data-i18n-aria-label="metric.add" hidden>
                <!-- Google Material Icons: add -->
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                </svg>
            </button>
        </main>

        <nav class="bottom-nav" role="tablist" aria-label="Main navigation"
            data-i18n-aria-label="nav.label">

            <button class="nav-item" type="button" role="tab" id="tab-time" aria-controls="page-time"
                aria-selected="true" data-page="time">
                <span class="nav-icon" aria-hidden="true">
                    <!-- Google Material Icons: hourglass_full -->
                    <svg viewBox="0 0 24 24" focusable="false">
                        <path
                            d="M6 2v6h.01L6 8.01 10 12l-4 4 .01.01H6V22h12v-5.99h-.01L18 16l-4-4 4-3.99-.01-.01H18V2H6z" />
                    </svg>
                </span>
                <span class="nav-label" data-i18n="nav.time">Time</span>
            </button>

            <button class="nav-item" type="button" role="tab" id="tab-behavior" aria-controls="page-behavior"
                aria-selected="false" data-page="behavior">
                <span class="nav-icon" aria-hidden="true">
                    <!-- Google Material Icons: category -->
                    <svg viewBox="0 0 24 24" focusable="false">
                        <path d="M12 2l-5.5 9h11z" />
                        <circle cx="17.5" cy="17.5" r="4.5" />
                        <path d="M3 13.5h8v8H3z" />
                    </svg>
                </span>
                <span class="nav-label" data-i18n="nav.behavior">Behavior</span>
            </button>

            <button class="nav-item" type="button" role="tab" id="tab-metric" aria-controls="page-metric"
                aria-selected="false" data-page="metric">
                <span class="nav-icon" aria-hidden="true">
                    <!-- Google Material Icons: analytics -->
                    <svg viewBox="0 0 24 24" focusable="false">
                        <path
                            d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-5h2v5zm4 0h-2v-3h2v3zm0-5h-2v-2h2v2zm4 5h-2V7h2v10z" />
                    </svg>
                </span>
                <span class="nav-label" data-i18n="nav.metric">Track</span>
            </button>

            <button class="nav-item" type="button" role="tab" id="tab-setting" aria-controls="page-setting"
                aria-selected="false" data-page="setting">
                <span class="nav-icon" aria-hidden="true">
                    <!-- Google Material Icons: settings -->
                    <svg viewBox="0 0 24 24" focusable="false">
                        <path
                            d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z" />
                    </svg>
                </span>
                <span class="nav-label" data-i18n="nav.setting">Setting</span>
            </button>
        </nav>
    </div>

    <!-- 卡片多选的顶部操作栏 -->
    <div class="selection-bar" id="selection-bar" hidden>
        <button class="icon-button" type="button" id="selection-close" aria-label="Cancel selection"
            data-i18n-aria-label="selection.cancel">
            <!-- Google Material Icons: close -->
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                    d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
            </svg>
        </button>

        <span class="selection-count" id="selection-count"></span>

        <button class="icon-button" type="button" id="selection-delete" aria-label="Delete selected"
            data-i18n-aria-label="selection.delete">
            <!-- Google Material Icons: delete -->
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
            </svg>
        </button>
    </div>

    <!-- 行为详情页：全屏覆盖在 app 之上（自带标题栏，所以盖住底部导航） -->
    <section class="detail" id="behavior-detail" role="dialog" aria-modal="true"
        aria-labelledby="detail-title" hidden>
        <header class="detail-header">
            <button class="icon-button" type="button" id="detail-back" aria-label="Back"
                data-i18n-aria-label="behavior.detail.back">
                <!-- Google Material Icons: arrow_back -->
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                </svg>
            </button>

            <h1 class="page-title" id="detail-title"></h1>

            <button class="icon-button" type="button" id="detail-menu" aria-haspopup="menu"
                aria-expanded="false" aria-label="More options" data-i18n-aria-label="behavior.menu.open">
                <!-- Google Material Icons: more_vert -->
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                        d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" />
                </svg>
            </button>
        </header>

        <nav class="seg-nav" id="detail-view-nav" aria-label="Switch view"
            data-i18n-aria-label="view.switch">
            <button class="seg-nav-item" type="button" data-view="records" aria-selected="true"
                data-i18n="view.records">Records</button>
            <button class="seg-nav-item" type="button" data-view="stats" aria-selected="false"
                data-i18n="view.stats">Stats</button>
        </nav>

        <div class="detail-body">
            <ul class="card-list" id="detail-list"></ul>
        </div>
    </section>

    <!-- 跟踪详情页：与行为详情页同构（标题栏 + 视图栏），但记录视图自带悬浮按钮 -->
    <section class="detail" id="metric-detail" role="dialog" aria-modal="true"
        aria-labelledby="metric-detail-title" hidden>
        <header class="detail-header">
            <button class="icon-button" type="button" id="metric-detail-back" aria-label="Back"
                data-i18n-aria-label="behavior.detail.back">
                <!-- Google Material Icons: arrow_back -->
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                </svg>
            </button>

            <h1 class="page-title" id="metric-detail-title"></h1>

            <button class="icon-button" type="button" id="metric-detail-menu" aria-haspopup="menu"
                aria-expanded="false" aria-label="More options" data-i18n-aria-label="behavior.menu.open">
                <!-- Google Material Icons: more_vert -->
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                        d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" />
                </svg>
            </button>
        </header>

        <nav class="seg-nav" id="metric-detail-view-nav" aria-label="Switch view"
            data-i18n-aria-label="view.switch">
            <button class="seg-nav-item" type="button" data-view="records" aria-selected="true"
                data-i18n="view.records">Records</button>
            <button class="seg-nav-item" type="button" data-view="stats" aria-selected="false"
                data-i18n="view.stats">Stats</button>
        </nav>

        <div class="detail-body">
            <ul class="card-list" id="metric-detail-list"></ul>
        </div>

        <!-- 跟踪记录不属于时间记录，加不进时间页，所以这是它唯一的入口 -->
        <button class="fab" type="button" id="metric-record-fab" aria-label="Add entry"
            data-i18n-aria-label="metric.record.add" hidden>
            <!-- Google Material Icons: add -->
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
            </svg>
        </button>
    </section>

    <!-- 删除行为确认：必须输入行为名称（类似 GitHub 删仓库） -->
    <section class="sheet" id="sheet-delete-behavior" role="dialog" aria-modal="true"
        aria-labelledby="sheet-delete-title" hidden>
        <h2 class="sheet-title" id="sheet-delete-title" data-i18n="behavior.delete.title">
            Delete behavior</h2>
        <p class="sheet-text" id="delete-tip"></p>

        <div class="form-row">
            <input class="form-input form-input-left" id="delete-confirm-input" type="text"
                autocomplete="off" data-i18n-placeholder="behavior.delete.hint"
                placeholder="Behavior name" />
        </div>

        <div class="form-actions">
            <button class="btn" type="button" id="delete-cancel"
                data-i18n="action.cancel">Cancel</button>
            <button class="btn btn-danger" type="button" id="delete-confirm" disabled
                data-i18n="behavior.delete.confirm">Delete</button>
        </div>
    </section>

    <!-- 删除跟踪项确认：同样要输入名称 -->
    <section class="sheet" id="sheet-delete-metric" role="dialog" aria-modal="true"
        aria-labelledby="sheet-delete-metric-title" hidden>
        <h2 class="sheet-title" id="sheet-delete-metric-title" data-i18n="metric.delete.title">
            Delete tracker</h2>
        <p class="sheet-text" id="metric-delete-tip"></p>

        <div class="form-row">
            <input class="form-input form-input-left" id="metric-delete-input" type="text"
                autocomplete="off" data-i18n-placeholder="metric.delete.hint"
                placeholder="Tracker name" />
        </div>

        <div class="form-actions">
            <button class="btn" type="button" id="metric-delete-cancel"
                data-i18n="action.cancel">Cancel</button>
            <button class="btn btn-danger" type="button" id="metric-delete-confirm" disabled
                data-i18n="metric.delete.confirm">Delete</button>
        </div>
    </section>

    <!-- 弹窗遮罩 -->
    <div class="scrim" id="scrim" hidden></div>

    <!-- 跟踪项表单：名称 / 图标 / 取消·确定 -->
    <section class="sheet" id="sheet-metric" role="dialog" aria-modal="true"
        aria-labelledby="sheet-metric-title" hidden>
        <h2 class="sheet-title" id="sheet-metric-title" data-i18n="metric.form.title">New tracker</h2>

        <div class="form-row">
            <label class="form-label" for="metric-name" data-i18n="metric.form.name">Name</label>
            <input class="form-input" id="metric-name" type="text" maxlength="24" autocomplete="off"
                data-i18n-placeholder="metric.form.namePlaceholder" placeholder="e.g. Weight" />
        </div>

        <div class="form-block">
            <span class="form-label" data-i18n="behavior.form.icon">Icon</span>
            <!-- 图标由 icons.js 提供，这里由脚本填充 -->
            <div class="icon-picker" id="metric-icon-picker"></div>
        </div>

        <div class="form-actions">
            <button class="btn" type="button" id="metric-cancel"
                data-i18n="action.cancel">Cancel</button>
            <button class="btn btn-primary" type="button" id="metric-confirm" disabled
                data-i18n="action.confirm">Confirm</button>
        </div>
    </section>

    <!-- 跟踪记录表单：记录本身是时点，所以只有记录时间与记录值 -->
    <section class="sheet" id="sheet-metric-record" role="dialog" aria-modal="true"
        aria-labelledby="sheet-metric-record-title" hidden>
        <h2 class="sheet-title" id="sheet-metric-record-title" data-i18n="metric.record.title">
            New entry</h2>

        <div class="form-block">
            <div class="time-fields" id="metric-record-fields"></div>
            <p class="form-hint" id="metric-record-hint" hidden></p>
        </div>

        <div class="form-row">
            <label class="form-label" for="metric-record-value" data-i18n="metric.record.value">Value</label>
            <input class="form-input" id="metric-record-value" type="text" inputmode="decimal"
                autocomplete="off" data-i18n-placeholder="metric.record.valuePlaceholder"
                placeholder="0" />
        </div>

        <div class="form-actions">
            <button class="btn" type="button" id="metric-record-cancel"
                data-i18n="action.cancel">Cancel</button>
            <button class="btn btn-primary" type="button" id="metric-record-confirm" disabled
                data-i18n="action.confirm">Confirm</button>
        </div>
    </section>

    <!-- 行为表单：名称 / 图标 / 取消·确定 -->
    <section class="sheet" id="sheet-behavior" role="dialog" aria-modal="true"
        aria-labelledby="sheet-behavior-title" hidden>
        <h2 class="sheet-title" id="sheet-behavior-title" data-i18n="behavior.form.title">New behavior</h2>

        <div class="form-row">
            <label class="form-label" for="behavior-name" data-i18n="behavior.form.name">Name</label>
            <input class="form-input" id="behavior-name" type="text" maxlength="24" autocomplete="off"
                data-i18n-placeholder="behavior.form.namePlaceholder" placeholder="e.g. Sleep" />
        </div>

        <div class="form-block">
            <span class="form-label" data-i18n="behavior.form.icon">Icon</span>
            <!-- 图标由 icons.js 提供，这里由脚本填充 -->
            <div class="icon-picker" id="behavior-icon-picker"></div>
        </div>

        <div class="form-actions">
            <button class="btn" type="button" id="behavior-cancel"
                data-i18n="action.cancel">Cancel</button>
            <button class="btn btn-primary" type="button" id="behavior-confirm" disabled
                data-i18n="action.confirm">Confirm</button>
        </div>
    </section>

    <!-- 时间表单：行为 / 类型 / 时间 / 取消·确定 -->
    <section class="sheet" id="sheet-time" role="dialog" aria-modal="true"
        aria-labelledby="sheet-time-title" hidden>
        <h2 class="sheet-title" id="sheet-time-title" data-i18n="time.form.title">New record</h2>

        <div class="form-row">
            <label class="form-label" data-i18n="time.form.behavior">Behavior</label>
            <div class="select-wrap" id="time-behavior"></div>
        </div>

        <div class="form-row">
            <label class="form-label" data-i18n="time.form.type">Type</label>
            <div class="select-wrap" id="time-type"></div>
        </div>

        <div class="form-block">
            <!-- 必须先选类型，这里才可填写 -->
            <div class="time-fields" id="time-fields"></div>
            <p class="form-hint" id="time-hint" hidden></p>
        </div>

        <div class="form-actions">
            <button class="btn" type="button" id="time-cancel" data-i18n="action.cancel">Cancel</button>
            <button class="btn btn-primary" type="button" id="time-confirm" disabled
                data-i18n="action.confirm">Confirm</button>
        </div>
    </section>

    <!-- 应用内更新提示：原生壳查新版后推过来（见 update.js） -->
    <section class="sheet" id="sheet-update" role="dialog" aria-modal="true"
        aria-labelledby="sheet-update-title" hidden>
        <h2 class="sheet-title" id="sheet-update-title" data-i18n="update.title">Update available</h2>
        <p class="sheet-text" id="update-text"></p>
        <p class="sheet-text" id="update-stalled" hidden></p>

        <div class="update-progress" id="update-progress" hidden>
            <div class="update-track">
                <span class="update-fill" id="update-fill"></span>
            </div>
            <span class="update-percent" id="update-percent"></span>
        </div>

        <div class="form-actions">
            <button class="btn" type="button" id="update-later" data-i18n="update.later">Later</button>
            <button class="btn btn-primary" type="button" id="update-confirm"
                data-i18n="update.now">Update</button>
        </div>
    </section>

    <!-- 日期选择：统计视图的起止日期用它 -->
    <section class="sheet" id="sheet-date" role="dialog" aria-modal="true"
        aria-labelledby="sheet-date-title" hidden>
        <h2 class="sheet-title" id="sheet-date-title"></h2>

        <div class="form-block">
            <div class="time-fields" id="date-fields"></div>
            <p class="form-hint" id="date-hint" hidden></p>
        </div>

        <div class="form-actions">
            <button class="btn" type="button" id="date-cancel" data-i18n="action.cancel">Cancel</button>
            <button class="btn btn-primary" type="button" id="date-confirm"
                data-i18n="action.confirm">Confirm</button>
        </div>
    </section>

    <script src="i18n.js"></script>
    <script src="icons.js"></script>
    <script src="csv.js"></script>
    <script src="store.js"></script>
    <script src="metrics.js"></script>
    <script src="components.js"></script>
    <script src="datetime.js"></script>
    <script src="chart.js"></script>
    <script src="datepicker.js"></script>
    <script src="stats.js"></script>
    <script src="theme.js"></script>
    <script src="page-behavior.js"></script>
    <script src="page-behavior-detail.js"></script>
    <script src="page-time.js"></script>
    <script src="page-metric.js"></script>
    <script src="page-metric-detail.js"></script>
    <script src="setting.js"></script>
    <script src="update.js"></script>
    <script src="app.js"></script>
</body>

</html>
